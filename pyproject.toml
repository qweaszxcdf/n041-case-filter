[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "n041-case-filter"
version = "0.5.0"
description = "Generic N041 flat-table case filtering, extraction, and calculation framework"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dbf = ["dbfread>=2.0.7"]
xls = ["xlrd>=2.0.1"]
all = ["dbfread>=2.0.7", "xlrd>=2.0.1"]

[tool.setuptools.packages.find]
where = ["src"]
